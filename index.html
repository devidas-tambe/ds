<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Download Page</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box; 
      font-family: Arial, sans-serif;
    }

    body{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:linear-gradient(135deg,#4facfe,#00f2fe);
    }

    .container{
      text-align:center;
      background:white;
      padding:40px;
      border-radius:20px;
      box-shadow:0 10px 25px rgba(0,0,0,0.2);
      width:350px;
    }

    h1{
      margin-bottom:25px;
      color:#333;
    }

    .download-btn{
      display:block;
      width:100%;
      margin:12px 0;
      padding:14px;
      text-decoration:none;
      background:#007bff;
      color:white;
      border-radius:10px;
      font-size:16px;
      font-weight:bold;
      transition:0.3s;
    }

    .download-btn:hover{
      background:#0056b3;
      transform:scale(1.03);
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Downloads</h1>

    <a href="EX_1.txt" class="download-btn" download>Download File 1</a>
    <a href="EX_2.txt" class="download-btn" download>Download File 2</a>
    <a href="EX_3.txt" class="download-btn" download>Download File 3</a>
    <a href="EX_4 - PY.txt" class="download-btn" download>Download File 4</a>
    <a href="EX_5 - PY.txt" class="download-btn" download>Download File 5</a>
    <a href="EX_6 - PY.txt" class="download-btn" download>Download File 6</a>
    <a href="EX_7 - PY.txt" class="download-btn" download>Download File 7</a>
  </div>

</body>
</html>
